# Atualizacoes de rotina: no maximo um PR npm e um de Actions por semana.
# Majors npm exigem uma migracao deliberada. O filtro allow.update-types
# vale so para atualizacoes de versao, sem restringir correcoes de seguranca.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#update-types-allow
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      dependencias:
        patterns: ["*"]
        update-types: ["minor", "patch"]
