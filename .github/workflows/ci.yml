name: CI

# Roda em TODO push e em TODO pull request.
#
# Este repositorio nao tem o fluxo develop → main do chb_gaussfleet: e um site
# so, que a Vercel publica a partir da `main`. Entao o modelo aqui e o do
# suamarca_crm — tudo passa pela mesma checagem, e a `main` nunca recebe o que
# nao passou.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Sem isto o GITHUB_TOKEN nasce com escrita em tudo. A recomendacao oficial e
# comecar em leitura e subir permissao por job, quando algum precisar.
# https://docs.github.com/en/actions/reference/secure-use-reference
permissions:
  contents: read

# Push novo na mesma ref cancela a execucao anterior: so a ultima diz a verdade.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ⚠️ Actions presas ao SHA, com a versao no comentario ao lado. Tag e
      # ponteiro movel: quem controla o repositorio da action pode reapontar
      # `v7` para outro commit e passar a rodar codigo novo dentro da nossa CI.
      # SHA de commit e imutavel. O Dependabot atualiza estas linhas sozinho
      # (.github/dependabot.yml).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Le o .nvmrc, para a CI e a maquina de quem desenvolve nao divergirem
          # em silencio.
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # `npm ci` e nao `npm install`: instala exatamente o lockfile e falha se o
      # package.json divergir dele. E o que torna a CI reproduzivel.
      - name: Instalar dependencias
        run: npm ci

      # Aqui e quase sempre mudo (o runner JA esta num clone limpo). Existe para
      # os dois lados terem a mesma lista de passos — ver scripts/ci-local.mjs.
      - name: Nenhum fonte ignorado pelo git
        run: |
          escondidos=$(git ls-files --others --ignored --exclude-standard --directory -- src scripts supabase/migrations)
          if [ -n "$escondidos" ]; then
            echo "Fonte escondido pelo .gitignore:"; echo "$escondidos"; exit 1
          fi

      - name: Lint
        run: npm run lint

      # O `next build` com Turbopack transpila sem checar tipos a fundo. Sem
      # este passo um erro de tipo passa pela CI inteira e so aparece no editor
      # de alguem, depois.
      - name: Tipos
        run: npm run typecheck

      # A CI roda em UTC. `formatDate` e os timestamps do Supabase sao os unicos
      # lugares com fuso; teste que so passa no horario de Sao Paulo quebra aqui.
      - name: Testes
        run: npm test
        env:
          TZ: UTC

      # As migracoes nao sao aplicadas aqui: elas dependem dos schemas `auth` e
      # `storage`, que so existem numa instancia Supabase (subir uma pede
      # `supabase start`, Docker e varios minutos por push). O que da para
      # conferir de graca esta neste script — uuid de admin no SQL versionado,
      # service_role no codigo, `.env` commitado, nome das migracoes.
      - name: Schema e segredos
        run: npm run check:schema

      # Por ultimo: e o mais lento, e nao adianta buildar codigo que nao passou
      # nas checagens acima.
      #
      # ⚠️ As envs sao de MENTIRA, e de proposito. Duas coisas dependem disso:
      #
      #   - o cliente do browser (`lib/supabase.ts`) e criado no escopo do
      #     modulo e lanca no import se a url faltar — sem valor nenhum, o
      #     build morre em `/_not-found` antes de chegar em qualquer pagina;
      #   - com url falsa, `/icon` nao consegue buscar o avatar. Ele TEM de
      #     cair no icone de reserva em vez de derrubar o build, e este passo e
      #     o que garante isso. Ja derrubou.
      #
      # Como sao NEXT_PUBLIC, entram no bundle — que aqui e descartado.
      - name: Build de producao
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
